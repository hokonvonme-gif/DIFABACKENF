services:
  - type: web
    name: difabackenf
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: CORS_ORIGIN
        value: "*"

      - key: VONAGE_API_KEY
        sync: false
      - key: VONAGE_API_SECRET
        sync: false
      - key: VONAGE_FROM
        value: DIFA
      - key: OTP_DEBUG
        value: "false"

      # false = pas de paiements fictifs (obligatoire en prod réelle)
      - key: MOBILE_MONEY_SANDBOX
        value: "false"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_HASH
        sync: false
      - key: FLUTTERWAVE_REDIRECT_URL
        sync: false

      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest

      - key: REQUIRE_CERTIFICATION_TO_ORDER
        value: "false"
      - key: PHOTON_URL
        value: https://photon.komoot.io
      - key: NOMINATIM_URL
        value: https://nominatim.openstreetmap.org
      - key: ROUTING_URL
        value: https://router.project-osrm.org

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
